# ===================================================================
#  Sobe o sistema de analise de logs inteiro com um comando:
#
#    cd exemplos
#    minidocker compose up
#    copy processador\amostras\*.log fila\entrada\
#    abra http://localhost:8080
#
#  Uma secao [nome] por servico. As opcoes sao as mesmas do "run".
#  Caminhos relativos sao relativos a esta pasta.
# ===================================================================
projeto = relatorios

# Tres workers dividindo a mesma fila. Se um cair com erro, volta sozinho.
[processador]
build    = processador
replicas = 3
volume   = ./fila:fila
restart  = on-failure:3
pids     = 10

# O site, publicado em http://localhost:8080. Ele so le a fila, mas monta
# sem :ro: o :ro e um rotulo na pasta, e a mesma pasta nao pode ser so
# leitura para um container e gravavel para outro ao mesmo tempo.
[painel]
build   = painel
porta   = 8080:80
volume  = ./fila:fila
env     = TITULO=Logs analisados pelo MiniDocker
restart = always
depende = processador
